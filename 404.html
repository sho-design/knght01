<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not on the map | KNGHT</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
.lost{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:clamp(32px,6vw,96px);padding-block:clamp(96px,14vh,160px)}
.lost__code{font:italic 300 clamp(1.4rem,2vw,1.8rem)/1 var(--serif);color:var(--ash)}
.lost h1{font-size:clamp(3.2rem,9vw,8.4rem);margin:22px 0 28px}
.lost p{margin:0 0 40px;color:var(--ash);max-width:44ch;font-size:1.1rem}
.lost__sword{height:min(60svh,520px);width:auto}
.lost__sword *{fill:none;stroke:var(--argent);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s var(--ease) forwards}
.lost__sword .d2{animation-delay:.3s}.lost__sword .d3{animation-delay:.6s}.lost__sword .d4{animation-delay:.9s}
@media (max-width:700px){.lost{grid-template-columns:minmax(0,1fr)}.lost__sword{display:none}}
@media (prefers-reduced-motion:reduce){.lost__sword *{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main class="wrap lost">
  <div>
    <a class="mark" href="/" aria-label="KNGHT home">KNGHT</a>
    <p class="lost__code" style="margin:56px 0 0">404</p>
    <h1 class="display">Not on <em>the map.</em></h1>
    <p>This page does not exist, or it has moved. The rest of the world is still standing.</p>
    <div class="actions">
      <a class="btn" href="/">Return to KNGHT
        <svg class="arrow" viewBox="0 0 18 10" aria-hidden="true"><path d="M0 5h16M12 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </a>
      <a class="link" href="/#score">Score your world</a>
    </div>
  </div>
  <svg class="lost__sword" viewBox="0 0 120 600" aria-hidden="true">
    <circle cx="60" cy="28" r="14" pathLength="1"/>
    <path class="d2" d="M54 44 V124 M66 44 V124 M54 64 H66 M54 84 H66 M54 104 H66" pathLength="1"/>
    <path class="d3" d="M6 124 Q20 136 34 130 H86 Q100 136 114 124 M34 130 Q60 142 86 130" pathLength="1"/>
    <path class="d4" d="M50 142 L50 512 L60 584 L70 512 L70 142 Z M60 156 V504" pathLength="1"/>
  </svg>
</main>
</body>
</html>
